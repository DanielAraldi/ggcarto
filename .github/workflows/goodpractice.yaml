name: goodpractice

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goodpractice:
    name: goodpractice
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      NOT_CRAN: 'false'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_LIMIT_CORES_: 'true'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::goodpractice
            any::rcmdcheck
            any::covr
            any::lintr
            any::cyclocomp
            any::spelling
            any::tinytex
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        shell: Rscript {0}
        run: |
          tinytex::tlmgr_install(c(
            "inconsolata",
            "helvetic",
            "ec",
            "makeindex"
          ))

      - name: Run goodpractice
        env:
          GGCARTO_SOURCE: ${{ github.workspace }}
          GGCARTO_GP_OUTPUT: ${{ github.workspace }}/artifacts/goodpractice
        run: Rscript .github/scripts/goodpractice.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goodpractice-results
          path: artifacts/goodpractice
